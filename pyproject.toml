[project]
name = "sttx"
version = "0.1.0"
description = "Fast, private, and simple transcription for any media file using local models, even without a GPU"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE*", "NOTICE*"]
authors = [
    { name = "Korridzy", email = "korridzy.pub@gmail.com" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "sherpa-onnx",
    "sherpa-onnx-bin",
    "huggingface-hub",
    "numpy",
]

[project.scripts]
sttx = "sttx.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.basedpyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require current native packages, models, or network access",
]
