[project]
name = "sttx"
version = "0.1.1"
description = "Fast, private, and simple transcription for any media file using local models, even without a GPU"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE*", "NOTICE*"]
authors = [
    { name = "Korridzy", email = "korridzy.pub@gmail.com" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "sherpa-onnx==1.13.6",
    "sherpa-onnx-bin==1.13.6",
    "huggingface-hub==1.29.0",
    "numpy==2.4.6",
]
keywords = ["speech-to-text", "transcription", "asr", "sherpa-onnx", "parakeet", "cli", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.scripts]
sttx = "sttx.cli:main"

[project.urls]
Homepage = "https://github.com/Korridzy/sttx"
Repository = "https://github.com/Korridzy/sttx"
Issues = "https://github.com/Korridzy/sttx/issues"
Changelog = "https://github.com/Korridzy/sttx/releases"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.basedpyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require current native packages, models, or network access",
]
