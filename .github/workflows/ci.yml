name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Poetry check
        run: poetry check
      - name: Tests
        run: poetry run pytest -m "not integration"
      - name: Compile check
        run: poetry run python -m compileall -q src tests
      - name: Build
        run: poetry build
  checks:
    name: checks
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: All matrix legs must pass
        run: test "${{ needs.test.result }}" = "success"
