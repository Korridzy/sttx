name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify release tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(poetry version --short)"
      - name: Build distributions
        run: poetry build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    name: publish
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sttx/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
